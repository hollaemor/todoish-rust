version: "3"
services:
  db:
    image: postgres:14.4-alpine
    environment:
       POSTGRES_DB: todoish
       POSTGRES_USER: postgres
       POSTGRES_PASSWORD: passwd
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  
  app:
    depends_on:
      - db
    environment:
       DATABASE_URL: "postgres://postgres:passwd@db/todoish"
       SERVER_PORT: 8080
    ports:
      - "8080:8080"
    build:
      context: .
      dockerfile: Dockerfile
volumes:
  dbdata: